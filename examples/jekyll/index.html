---
layout: null
---

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{ site.title }}</title>
    <style>
      :root {
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #e9ece8;
        color: #1b201c;
      }
      body {
        margin: 0;
      }
      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 34px 0;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.03em;
      }
      header span {
        color: #68716a;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        text-transform: uppercase;
      }
      #chat {
        display: block;
      }
      @media (max-width: 600px) {
        main {
          width: 100%;
          padding: 0;
        }
        header {
          padding: 14px 16px;
          margin: 0;
        }
        header span {
          display: none;
        }
        #chat {
          --pretty-aui-height: calc(100vh - 55px);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>pretty-aui</h1>
        <span>Jekyll · standalone ESM · OpenCode ACP</span>
      </header>
      <div id="chat"></div>
    </main>
    <script type="module">
      import { mountChat, createWebSocketConnector } from "{{ '/assets/vendor/pretty-aui.js' | relative_url }}";

      const params = new URLSearchParams(location.search);
      const injectedLive = window.__PRETTY_AUI_LIVE__;
      const bridge = params.get("acp") ?? injectedLive?.url ?? "ws://127.0.0.1:7331/acp";
      const requestedScheme = params.get("scheme");
      const mounted = mountChat(document.querySelector("#chat"), {
        options: {
          connector: createWebSocketConnector(bridge, {
            ...(bridge === injectedLive?.url ? { protocols: injectedLive.protocols } : {}),
          }),
          protocol: 1,
          session: { cwd: params.get("cwd") ?? injectedLive?.cwd ?? {{ site.source | jsonify }} },
        },
        surface: params.get("surface") === "sidebar" ? "sidebar" : "inline",
        colorScheme: requestedScheme === "light" || requestedScheme === "dark" ? requestedScheme : "system",
      });
      window.prettyAui = mounted;
    </script>
  </body>
</html>
