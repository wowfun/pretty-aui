<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>pretty-aui production bundle fixture</title>
    <style nonce="pretty-aui-test">
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      #chat {
        width: 680px;
        height: 520px;
        min-width: 0;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="chat"></div>
    <script type="module" nonce="pretty-aui-test">
      import { mountChat } from "/standalone/pretty-aui.js";

      const connector = {
        open() {
          let incoming;
          let promptCount = 0;
          let sessionCount = 0;
          const readable = new ReadableStream({
            start(controller) {
              incoming = controller;
            },
          });
          const writable = new WritableStream({
            write(message) {
              if (!message || typeof message !== "object") return;
              if (message.method === "initialize") {
                respond(message.id, {
                  protocolVersion: 1,
                  agentInfo: {
                    name: "dist-fixture",
                    title: "Production Fixture",
                    version: "1.0.0",
                  },
                  agentCapabilities: {
                    promptCapabilities: {},
                    sessionCapabilities: {},
                  },
                });
              } else if (message.method === "session/new") {
                sessionCount += 1;
                respond(message.id, {
                  sessionId: `dist-session-${sessionCount}`,
                  modes: { currentModeId: "", availableModes: [] },
                });
              } else if (message.method === "session/prompt") {
                promptCount += 1;
                incoming.enqueue({
                  jsonrpc: "2.0",
                  method: "session/update",
                  params: {
                    sessionId: message.params.sessionId,
                    update: {
                      sessionUpdate: "agent_message_chunk",
                      content: {
                        type: "text",
                        text: [
                          `Production bundle answered ${promptCount}.`,
                          ...Array.from(
                            { length: 12 },
                            (_, index) =>
                              `Evidence ${promptCount}.${index + 1}: deterministic standalone transcript content.`,
                          ),
                        ].join("\n\n"),
                      },
                    },
                  },
                });
                respond(message.id, { stopReason: "end_turn" });
              }
            },
            close() {
              incoming.close();
            },
            abort(error) {
              incoming.error(error);
            },
          });
          function respond(id, result) {
            queueMicrotask(() =>
              incoming.enqueue({ jsonrpc: "2.0", id, result }),
            );
          }
          return { readable, writable };
        },
      };

      const mounted = mountChat(document.querySelector("#chat"), {
        options: {
          connector,
          session: { cwd: "/production-fixture" },
        },
        styleNonce: "pretty-aui-test",
      });
      window.__DIST_CHAT__ = mounted;
      mounted.ready.then(() => {
        document.body.dataset.ready = "true";
      });
    </script>
  </body>
</html>
